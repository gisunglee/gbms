(function () {
  const q = new URLSearchParams(location.search);
  const bKey = DB[q.get('b')] ? q.get('b') : 'notice';
  const board = DB[bKey];
  const id = q.get('id');
  const idx = board.list.findIndex(p => String(p.id) === String(id));

  document.getElementById('crumbBoard').textContent = board.label;
  document.getElementById('boardTitle').textContent = board.label;
  const backHref = 'index.html#' + (bKey === 'data' ? 'files' : 'notice');
  const app = document.getElementById('app');

  if (idx === -1) {
    app.innerHTML =
      '<div class="post-box"><div class="empty">요청하신 게시글을 찾을 수 없습니다.<br><br>' +
      '<a class="btn-solid" href="' + backHref + '">목록으로</a></div></div>';
    return;
  }

  const p = board.list[idx];
  document.title = p.title + ' | ' + board.label;

  const fileHtml = !p.files || p.files.length === 0
    ? '<li style="color:#8b98a8">첨부파일이 없습니다.</li>'
    : p.files.map(function (f) {
        const name = f[0], path = f[1], size = f[2] || '';
        return path
          ? '<li>📎 <a href="' + path + '" download>' + name + '</a> <span class="size">(' + size + ')</span></li>'
          : '<li>📎 <span style="color:#8b98a8">' + name + '</span> <span class="size">(' + size + ' · 준비 중)</span></li>';
      }).join('');

  const prev = board.list[idx - 1];
  const next = board.list[idx + 1];
  const link = function (item) {
    return item
      ? '<a href="view.html?b=' + bKey + '&id=' + item.id + '">' + item.title + '</a>'
      : '<span class="off">해당 글이 없습니다.</span>';
  };

  app.innerHTML =
    '<div class="post-box">' +
      '<div class="post-title"><h2>' +
        (p.pin ? '<span class="badge badge-notice">필독</span>' : '') +
        (p.isNew ? '<span class="badge badge-new">NEW</span>' : '') +
        p.title + '</h2></div>' +
      '<div class="post-meta">' +
        '<span><b>번호</b>' + p.no + '</span>' +
        '<span><b>작성자</b>' + p.writer + '</span>' +
        '<span><b>등록일</b>' + p.date + '</span>' +
        '<span><b>조회수</b>' + p.hit + '</span>' +
      '</div>' +
      '<div class="post-body">' + p.body + '</div>' +
      '<div class="post-files"><h4>첨부파일</h4><ul>' + fileHtml + '</ul></div>' +
      '<div class="post-nav">' +
        '<div><span class="lbl">▲ 이전글</span>' + link(prev) + '</div>' +
        '<div><span class="lbl">▼ 다음글</span>' + link(next) + '</div>' +
      '</div>' +
    '</div>' +
    '<div class="post-actions">' +
      '<a class="btn-line" href="javascript:history.back()">◀ 뒤로</a>' +
      '<a class="btn-solid" href="' + backHref + '">목록으로</a>' +
    '</div>';
})();
